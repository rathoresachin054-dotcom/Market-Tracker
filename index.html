
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CryptoTracker | Market Overview</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            overflow-x: hidden;
        }

        button,
        input,
        select {
            min-width: 0;
        }

        #detailContent {
            overflow-wrap: anywhere;
            word-break: normal;
        }

        #detailContent img {
            max-width: 100%;
        }

        #detailContent a {
            color: #fb923c;
        }

        #detailContent table {
            display: block;
            max-width: 100%;
            overflow-x: auto;
        }

        @media (max-width: 640px) {
            main {
                padding-left: 16px;
                padding-right: 16px;
            }

            #coinDetails {
                padding: 16px;
            }

            #detailContent h2 {
                font-size: 24px;
            }

            #detailContent h3 {
                overflow-wrap: anywhere;
            }

            #detailContent .leading-8 {
                line-height: 1.8;
            }
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <nav class="sticky top-0 z-50 border-b border-slate-800 bg-slate-900/95 backdrop-blur">

        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">

            <div>
                <h1 class="text-xl font-bold text-orange-400 sm:text-2xl">
                    CryptoTracker.
                </h1>

                <p class="text-xs text-slate-400">
                    Your crypto market dashboard
                </p>
            </div>

            <div class="flex flex-wrap gap-2 sm:gap-3">

                <button
                    id="homeBtn"
                    class="rounded-lg bg-slate-800 px-3 py-2 text-sm transition hover:bg-orange-500 sm:px-5"
                >
                    Markets
                </button>

                <button
                    id="watchlistBtn"
                    class="rounded-lg bg-slate-800 px-3 py-2 text-sm transition hover:bg-orange-500 sm:px-5"
                >
                    Watchlist ★
                </button>

            </div>

        </div>

    </nav>

    <main class="mx-auto w-full max-w-7xl px-4 py-7 sm:px-6 sm:py-10 lg:px-8">

        <section class="mb-8 sm:mb-10">

            <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-orange-400 sm:text-sm">
                Market Overview
            </p>

            <h2 class="text-2xl font-bold leading-tight sm:text-4xl lg:text-5xl">
                Cryptocurrency Market
            </h2>

            <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-400 sm:text-base">
                Track prices, discover coins and manage your watchlist.
            </p>

        </section>

        <section class="mb-8 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-[1fr_220px_auto]">

            <input
                id="searchInput"
                type="text"
                placeholder="Search cryptocurrency..."
                class="w-full rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm outline-none transition focus:border-orange-400 sm:px-5"
            >

            <select
                id="sortSelect"
                class="w-full rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm outline-none transition focus:border-orange-400"
            >

                <option value="market_cap">
                    Market Cap: High to Low
                </option>

                <option value="price_low">
                    Price: Low to High
                </option>

                <option value="price_high">
                    Price: High to Low
                </option>

                <option value="change">
                    24h Change: High to Low
                </option>

            </select>

            <button
                id="refreshBtn"
                class="w-full rounded-xl bg-orange-500 px-6 py-3 text-sm font-semibold transition hover:bg-orange-600 active:scale-95 sm:col-span-2 lg:col-span-1"
            >
                ↻ Refresh
            </button>

        </section>

        <section class="mb-5 flex flex-wrap items-center justify-between gap-3">

            <h3 id="sectionTitle" class="text-lg font-semibold sm:text-xl">
                Top Cryptocurrencies
            </h3>

            <span class="text-xs text-slate-400 sm:text-sm">
                Prices in USD
            </span>

        </section>

        <p
            id="status"
            class="mb-6 text-center text-sm text-orange-400"
        ></p>

        <section
            id="coinContainer"
            class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 lg:grid-cols-3 xl:grid-cols-4"
        ></section>

       
<section
    id="coinDetails"
    class="mt-6 hidden scroll-mt-24 overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 p-4 shadow-2xl shadow-black/20 sm:mt-8 sm:p-6 lg:p-8"
>

    <button
        id="backBtn"
        type="button"
        class="mb-6 flex w-full items-center justify-center gap-2 rounded-xl bg-orange-500 px-5 py-3 text-sm font-bold text-white transition hover:bg-orange-600 sm:w-auto"
    >
        ← Back to Market
    </button>

    <div id="detailContent" class="min-w-0 w-full"></div>

</section>


        <footer class="mt-12 border-t border-slate-800 py-7 text-center sm:mt-16">

            <h3 class="text-lg font-bold text-orange-400">
                CryptoTracker.
            </h3>

            <p class="mt-2 text-xs text-slate-500 sm:text-sm">
                Cryptocurrency Market Tracker using CoinGecko API
            </p>

            <p class="mt-2 text-xs text-slate-600">
                © 2026 CryptoTracker. All rights reserved.
            </p>

        </footer>

    </main>

    <script src="app.js"></script>

</body>

</html>
