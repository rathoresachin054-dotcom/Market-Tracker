
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTracker | Market Overview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <nav class="border-b border-slate-800 bg-slate-900/80">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5">
            <div>
                <h1 class="text-2xl font-bold text-orange-400">CryptoTracker.</h1>
                <p class="text-xs text-slate-400">Your crypto market dashboard</p>
            </div>

            <div class="flex gap-3">
                <button id="homeBtn" class="rounded-lg bg-slate-800 px-4 py-2 hover:bg-slate-700">
                    Markets
                </button>
                <button id="watchlistBtn" class="rounded-lg bg-slate-800 px-4 py-2 hover:bg-slate-700">
                    Watchlist ★
                </button>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-7xl px-5 py-10">

        <section class="mb-10">
            <p class="mb-2 text-sm font-medium uppercase tracking-widest text-orange-400">
                Market Overview
            </p>
            <h2 class="text-3xl font-bold sm:text-4xl">
                Cryptocurrency Market
            </h2>
            <p class="mt-3 text-slate-400">
                Track prices, discover coins and manage your watchlist.
            </p>
        </section>

        <section class="mb-8 flex flex-col gap-4 md:flex-row">

            <input
                id="searchInput"
                type="text"
                placeholder="Search cryptocurrency..."
                class="min-w-0 flex-1 rounded-xl border border-slate-700 bg-slate-900 px-5 py-3 outline-none focus:border-orange-400"
            >

            <select
                id="sortSelect"
                class="rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 outline-none focus:border-orange-400"
            >
                <option value="market_cap">Market Cap: High to Low</option>
                <option value="price_low">Price: Low to High</option>
                <option value="price_high">Price: High to Low</option>
                <option value="change">24h Change: High to Low</option>
            </select>

            <button
                id="refreshBtn"
                class="rounded-xl bg-orange-500 px-6 py-3 font-semibold hover:bg-orange-600 active:scale-95"
            >
                ↻ Refresh
            </button>

        </section>

        <section class="mb-5 flex items-center justify-between">
            <h3 id="sectionTitle" class="text-xl font-semibold">Top 20 Cryptocurrencies</h3>
            <span class="text-sm text-slate-400">Prices in USD</span>
        </section>

        <p id="status" class="mb-6 text-center text-orange-400"></p>

<div id="coinDetails" class="hidden mb-8 rounded-2xl border border-slate-800 bg-slate-900 p-6">

    <button id="backBtn" class="mb-6 rounded-lg bg-orange-500 px-4 py-2 text-white hover:bg-orange-600">
        ← Back to Coins
    </button>

    <div id="detailContent"></div>

</div>

        <section
            id="coinContainer"
            class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
        ></section>

        <section id="detailContainer" class="mt-8"></section>

    </main>

    <script src="app.js"></script>
</body>
</html>
